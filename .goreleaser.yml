version: 2

builds:
  - id: gh-htmlgist
    main: ./cmd/gh-htmlgist
    binary: gh-htmlgist
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: htmlgist-proxy
    main: ./cmd/htmlgist-proxy
    binary: htmlgist-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: cli
    builds:
      - gh-htmlgist
    name_template: "gh-htmlgist-{{ .Os }}-{{ .Arch }}"
    format: binary

  - id: proxy
    builds:
      - htmlgist-proxy
    name_template: "htmlgist-proxy-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
